<!DOCTYPE html>
<html>

<head>
    <title>WebSocket Example</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        .result-box {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f8f8f8;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        /* New styles for status indicators */
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .connected {
            background-color: #4CAF50;
        }

        .connecting {
            background-color: #FFC107;
            animation: blink 1s infinite;
        }

        .disconnected {
            background-color: #F44336;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        #connection-status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        #error-container {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
            background-color: #FFEBEE;
            color: #D32F2F;
            display: none;
        }

        #data-container {
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .data-item {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }

        .info-message {
            background-color: #E3F2FD;
            border-left: 4px solid #2196F3;
            padding: 8px;
        }

        .warning-message {
            background-color: #FFF3E0;
            border-left: 4px solid #FF9800;
            padding: 8px;
        }

        /* Serial Terminal Styles */
        .terminal-container {
            margin-top: 10px;
        }

        .input-group {
            display: flex;
            margin-bottom: 10px;
        }

        #command-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
        }

        #send-command-btn {
            padding: 8px 15px;
            border: 1px solid #2196F3;
            background-color: #2196F3;
            color: white;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        #send-command-btn:hover {
            background-color: #0b7dda;
        }

        .terminal-output {
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Map styles */
        #map-container {
            height: 400px;
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .device-marker-popup {
            text-align: center;
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <h1>WebSocket Data Stream</h1>

    <!-- Server status section -->
    <div>
        <h2>Server Status</h2>
        <button id="check-status-btn">Check Server Status</button>
        <div id="server-status" class="result-box" style="display: none;"></div>
    </div>

    <!-- Connection status indicator -->
    <div id="connection-status">
        <span class="status-indicator disconnected"></span>
        <span id="status-text">Disconnected</span>
    </div>

    <!-- Error display -->
    <div id="error-container"></div>

    <!-- Handshake test section -->
    <div>
        <h2>Device Handshake Test</h2>
        <button id="test-handshake-btn">Test Handshake</button>
        <div id="handshake-result" class="result-box" style="display: none;"></div>
    </div>

    <!-- Serial Terminal Section -->
    <div>
        <h2>Serial Terminal</h2>
        <div class="terminal-container">
            <div class="input-group">
                <input type="text" id="command-input" placeholder="Enter command to send...">
                <button id="send-command-btn">Send</button>
            </div>
            <div id="terminal-output" class="result-box terminal-output"></div>
        </div>
    </div>

    <h2>Data Stream</h2>
    <div id="data-container"></div>

    <!-- Add Map Container -->
    <h2>Location Map</h2>
    <div id="map-container">
        <div id="map"></div>
    </div>

    <script>
        // WebSocket URL (replace with your FastAPI server's URL)
        const wsUrl = 'ws://127.0.0.1:8000/serial-data';
        const baseApiUrl = 'http://127.0.0.1:8000';

        // WebSocket connection management
        let socket;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        let reconnectTimeout = 1000; // Start with 1s timeout
        let reconnectTimer;
        let intentionalClose = false;

        // Map initialization and variables
        let map;
        let deviceMarkers = {};

        // Initialize map
        function initMap() {
            // Create map centered on a default location
            map = L.map('map').setView([0, 0], 2);

            // Add OpenStreetMap layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // Update or add a marker for a device
        function updateDeviceMarker(did, latitude, longitude, additionalInfo = {}) {
            // Skip if coordinates are invalid
            if (!latitude || !longitude || isNaN(latitude) || isNaN(longitude)) {
                console.warn('Invalid coordinates for device:', did);
                return;
            }

            const latNum = parseFloat(latitude);
            const lngNum = parseFloat(longitude);

            // Skip if coordinates are out of valid range
            if (latNum < -90 || latNum > 90 || lngNum < -180 || lngNum > 180) {
                console.warn('Coordinates out of range for device:', did, latNum, lngNum);
                return;
            }

            // If marker exists, update its position
            if (deviceMarkers[did]) {
                deviceMarkers[did].setLatLng([latNum, lngNum]);
            } else {
                // Create a new marker
                const marker = L.marker([latNum, lngNum]).addTo(map);
                deviceMarkers[did] = marker;
            }

            // Update popup content
            const popupContent = `
                <div class="device-marker-popup">
                    <h3>Device ID: ${did}</h3>
                    <p>Latitude: ${latNum.toFixed(6)}</p>
                    <p>Longitude: ${lngNum.toFixed(6)}</p>
                    ${additionalInfo.battery ? `<p>Battery: ${additionalInfo.battery}%</p>` : ''}
                    ${additionalInfo.rssi ? `<p>RSSI: ${additionalInfo.rssi}</p>` : ''}
                </div>
            `;

            deviceMarkers[did].bindPopup(popupContent).openPopup();

            // Pan to the latest marker
            map.panTo([latNum, lngNum]);
        }

        // Connect to WebSocket with better handling
        function connectWebSocket() {
            // Update UI
            updateConnectionStatus('connecting');

            // Clear any previous connection
            if (socket) {
                intentionalClose = true;
                socket.close();
            }

            // Create a new WebSocket connection
            socket = new WebSocket(wsUrl);

            // Handle connection success
            socket.onopen = function (event) {
                console.log('Connected to WebSocket server');
                reconnectAttempts = 0;
                reconnectTimeout = 1000; // Reset timeout
                updateConnectionStatus('connected');
                hideError();
            };

            // Handle incoming data
            socket.onmessage = function (event) {
                console.log('Raw data:', event.data);
                try {
                    const data = JSON.parse(event.data);
                    const container = document.getElementById('data-container');

                    // Check if there's an error in the data
                    if (data.error) {
                        showError(`Server error: ${data.error}`);
                        return;
                    }

                    // Handle info messages (like handshake data)
                    if (data.info) {
                        container.innerHTML = `<div class="data-item info-message">
                            <strong>${data.info}</strong><br>
                            Data: ${data.data}<br>
                            Hex: ${data.hex}
                        </div>` + container.innerHTML;
                        return;
                    }

                    // Handle warning messages (like malformed data)
                    if (data.warning) {
                        container.innerHTML = `<div class="data-item warning-message">
                            <strong>${data.warning}</strong><br>
                            Length: ${data.data_length}<br>
                            Hex: ${data.hex}
                        </div>` + container.innerHTML;
                        return;
                    }

                    // Handle normal data messages
                    container.innerHTML = `<div class="data-item">${data.header}, DID: ${data.did}, Lat: ${data.latitude}, Long: ${data.longitude}, d2h: ${data.device_to_host_rssi}, batt: ${data.battery_percent}</div>` + container.innerHTML;

                    // Update map with device location
                    if (data.did && data.latitude && data.longitude) {
                        updateDeviceMarker(data.did, data.latitude, data.longitude, {
                            battery: data.battery_percent,
                            rssi: data.device_to_host_rssi
                        });
                    }

                    // Limit number of displayed items to prevent browser slowdown
                    const items = container.getElementsByClassName('data-item');
                    if (items.length > 100) {
                        container.removeChild(items[items.length - 1]);
                    }
                } catch (e) {
                    console.error('Error parsing data:', e);
                    showError(`Error parsing data: ${e.message}`);
                }
            };

            // Handle connection close
            socket.onclose = function (event) {
                console.log('Connection closed', event);
                updateConnectionStatus('disconnected');

                // Don't reconnect if intentionally closed
                if (intentionalClose) {
                    intentionalClose = false;
                    return;
                }

                // Implement exponential backoff for reconnection
                if (reconnectAttempts < maxReconnectAttempts) {
                    showError(`Connection lost. Reconnecting in ${reconnectTimeout / 1000}s...`);
                    console.log(`Reconnecting in ${reconnectTimeout / 1000}s... (Attempt ${reconnectAttempts + 1}/${maxReconnectAttempts})`);

                    clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(() => {
                        reconnectAttempts++;
                        reconnectTimeout = Math.min(30000, reconnectTimeout * 2); // Exponential backoff, max 30s
                        connectWebSocket();
                    }, reconnectTimeout);
                } else {
                    showError(`Failed to connect after ${maxReconnectAttempts} attempts. Please check server status.`);
                }
            };

            // Handle errors
            socket.onerror = function (error) {
                console.log('WebSocket error:', error);
                showError('Connection error. Server might be unavailable.');
            };
        }

        // Function to update connection status in UI
        function updateConnectionStatus(status) {
            const statusIndicator = document.querySelector('.status-indicator');
            const statusText = document.getElementById('status-text');
            const connectionStatus = document.getElementById('connection-status');

            statusIndicator.className = 'status-indicator';

            switch (status) {
                case 'connected':
                    statusIndicator.classList.add('connected');
                    statusText.textContent = 'Connected';
                    connectionStatus.style.backgroundColor = '#E8F5E9';
                    break;
                case 'connecting':
                    statusIndicator.classList.add('connecting');
                    statusText.textContent = 'Connecting...';
                    connectionStatus.style.backgroundColor = '#FFF8E1';
                    break;
                case 'disconnected':
                    statusIndicator.classList.add('disconnected');
                    statusText.textContent = 'Disconnected';
                    connectionStatus.style.backgroundColor = '#FFEBEE';
                    break;
            }
        }

        // Show error message
        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.textContent = message;
            errorContainer.style.display = 'block';
        }

        // Hide error message
        function hideError() {
            document.getElementById('error-container').style.display = 'none';
        }

        // Initialize connection when page loads
        window.addEventListener('load', function () {
            connectWebSocket();
            initMap(); // Initialize the map
        });

        // Server status check
        document.getElementById('check-status-btn').addEventListener('click', async function () {
            const resultElement = document.getElementById('server-status');

            resultElement.style.display = 'block';
            resultElement.innerHTML = 'Checking server status...';

            try {
                const response = await fetch(`${baseApiUrl}/status`);
                const data = await response.json();

                let statusHtml = '<h3>Server Status</h3>';
                statusHtml += `<p>Status: <span class="success">${data.status}</span></p>`;
                statusHtml += `<p>Serial Port: ${data.serial_port} (${data.port_available ? 'Available' : 'Not Available'})</p>`;

                if (data.error) {
                    statusHtml += `<p>Error: <span class="error">${data.error}</span></p>`;
                }

                if (data.database) {
                    statusHtml += `<p>Stored Records: ${data.database.recent_records_count}</p>`;
                    if (data.database.latest_record_timestamp) {
                        statusHtml += `<p>Latest Record: ${new Date(data.database.latest_record_timestamp).toLocaleString()}</p>`;
                    }
                }

                resultElement.innerHTML = statusHtml;
            } catch (error) {
                resultElement.innerHTML = `<div class="error">Error connecting to server</div><div>${error.message}</div>`;
            }
        });

        // Handshake test functionality
        document.getElementById('test-handshake-btn').addEventListener('click', async function () {
            const resultElement = document.getElementById('handshake-result');

            // Show loading state
            resultElement.style.display = 'block';
            resultElement.innerHTML = 'Testing handshake...';
            resultElement.className = 'result-box';

            try {
                const response = await fetch(`${baseApiUrl}/test-handshake`);
                const data = await response.json();

                if (data.status === 'success') {
                    resultElement.innerHTML = `<div class="success">Handshake successful!</div>
                                              <div>Response 1: ${data.response1}</div>
                                              <div>Response 2: ${data.response2}</div>`;
                } else {
                    resultElement.innerHTML = `<div class="error">Handshake failed</div>
                                              <div>Error: ${data.message}</div>`;
                }
            } catch (error) {
                resultElement.innerHTML = `<div class="error">Error connecting to server</div>
                                          <div>${error.message}</div>`;
            }
        });

        // Serial Terminal functionality
        document.getElementById('send-command-btn').addEventListener('click', async function () {
            const commandInput = document.getElementById('command-input');
            const terminalOutput = document.getElementById('terminal-output');
            const command = commandInput.value.trim();

            if (!command) {
                showError('Please enter a command to send');
                return;
            }

            // Show sending state
            terminalOutput.innerHTML = 'Sending command...';

            try {
                const response = await fetch(`${baseApiUrl}/send-command`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command: command }),
                });

                const data = await response.json();

                if (data.status === 'success') {
                    let responseHtml = `<h3>Response (${data.count} line${data.count !== 1 ? 's' : ''})</h3>`;

                    if (data.count === 0) {
                        responseHtml += '<p><em>No response received from device</em></p>';
                    } else {
                        responseHtml += '<div style="margin-top: 10px;">';
                        data.responses.forEach((resp, index) => {
                            responseHtml += `<div style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: ${index < data.count - 1 ? '1px dashed #ccc' : 'none'
                                }">`;
                            responseHtml += `<div><strong>Line ${index + 1}:</strong> ${resp.raw}</div>`;
                            responseHtml += `<div><small>Hex: ${resp.hex}</small></div>`;
                            responseHtml += '</div>';
                        });
                        responseHtml += '</div>';
                    }

                    terminalOutput.innerHTML = responseHtml;
                } else {
                    terminalOutput.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                terminalOutput.innerHTML = `<div class="error">Error connecting to server</div><div>${error.message}</div>`;
            }

            // Clear the input after sending
            commandInput.value = '';
        });

        // Allow pressing Enter in the command input to send
        document.getElementById('command-input').addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                document.getElementById('send-command-btn').click();
            }
        });
    </script>
</body>

</html>
